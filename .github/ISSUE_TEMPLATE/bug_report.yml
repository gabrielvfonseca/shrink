name: Bug report
description: Report something that behaves incorrectly
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        **Token-cost never sends your code anywhere** — it runs entirely offline on
        your machine. You can safely paste file contents below.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you observe?
      placeholder: The treemap showed the same file twice.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: Each file should appear exactly once.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact commands you ran, and the repo layout if relevant.
      render: shell
      placeholder: |
        npx shrink ./src --top 3
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: shrink version
      description: Output of `npx shrink --version`
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`
      placeholder: v20.11.0
    validations:
      required: true

  - type: dropdown
    id: output-mode
    attributes:
      label: Which output mode were you using?
      multiple: true
      options:
        - Terminal report
        - HTML report
        - JSON output
        - All of them
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else — a minimal repo that reproduces it is ideal.
