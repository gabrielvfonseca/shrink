name: Feature request
description: Suggest a new capability or an improvement
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion.

        **Token-cost never sends your code anywhere** — it runs entirely offline on
        your machine.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the pain, not the solution.
      placeholder: I cannot tell which of my vendored files are safe to exclude.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like the tool to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      placeholder: A `.tokenignore` rule, or a new CLI flag.

  - type: dropdown
    id: area
    attributes:
      label: Which area does this affect?
      multiple: true
      options:
        - Scanning and ignore rules
        - Token counting
        - Terminal report
        - HTML report
        - JSON output
        - CLI flags
        - Documentation
        - New idea
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to implement this
          required: false
        - label: This is a breaking change
          required: false
