name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Ultracite check
        run: npm run check:lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Smoke test the CLI
        run: |
          node bin/index.js --version
          node bin/index.js --json . | head -c 200
          node bin/index.js --html . | grep -q "<svg" 

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Verify published package contents
        run: npm pack --dry-run
